name = "gwf-hfb"
schema_version = "2"
subtype = "stress"

[blocks.options]
name = "options"

[blocks.options.fields.print_input]
name = "print_input"
longname = "model print input to listing file"
description = "keyword to indicate that the list of hydraulic flow barriers will be written to the listing file immediately after it is read."
optional = true

[blocks.dimensions]
name = "dimensions"

[blocks.dimensions.fields.maxhfb]
name = "maxhfb"
longname = "maximum number of barriers"
description = "integer value specifying the maximum number of hydraulic flow barriers that will be entered in this input file.  the value of maxhfb is used to allocate memory for the hydraulic flow barriers."
tagged = false

[blocks.period]
name = "period"

[blocks.period.fields.stress_period_data]
name = "stress_period_data"

[blocks.period.fields.stress_period_data.item]
name = "stress_period_data"

[blocks.period.fields.stress_period_data.item.fields.cellid1]
name = "cellid1"
longname = "first cell adjacent to barrier"
description = "identifier for the first cell.  for a structured grid that uses the dis input file, cellid1 is the layer, row, and column numbers of the cell.   for a grid that uses the disv input file, cellid1 is the layer number and cell2d number for the two cells.  if the model uses the unstructured discretization (disu) input file, then cellid1 is the node number for the cell.  the barrier is located between cells designated as cellid1 and cellid2.  the program will terminate with an error if cellid1 and cellid2 are not horizontally or vertically adjacent."
dtype = "integer"
shape = [
    "ncelldim",
]

[blocks.period.fields.stress_period_data.item.fields.cellid2]
name = "cellid2"
longname = "second cell adjacent to barrier"
description = "identifier for the second cell. see cellid1 for description of how to specify."
dtype = "integer"
shape = [
    "ncelldim",
]

[blocks.period.fields.stress_period_data.item.fields.hydchr]
name = "hydchr"
longname = "barrier hydraulic characteristic"
description = "is the hydraulic characteristic of the hydraulic-flow barrier. the hydraulic characteristic is the barrier hydraulic conductivity divided by the width of the hydraulic-flow barrier. if the hydraulic characteristic is negative, then the absolute value of hydchr acts as a multiplier to the conductance between the two model cells specified as containing the barrier. for example, if the value for hydchr was specified as -1.5, the conductance calculated for the two cells would be multiplied by 1.5."
tagged = false

[dims.maxhfb]
field = "maxhfb"
scope = "gwf"
