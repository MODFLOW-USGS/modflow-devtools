schema_version = "1.1"
name = "sim-nam"
multi = false
advanced = false

[blocks.options.continue]
name = "continue"
type = "keyword"
block = "options"
longname = "continue if not converged"
description = "keyword flag to indicate that the simulation should continue even if one or more solutions do not converge."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.options.nocheck]
name = "nocheck"
type = "keyword"
block = "options"
longname = "turn off checking"
description = "keyword flag to indicate that the model input check routines should not be called prior to each time step. Checks are performed by default."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.options.memory_print_option]
name = "memory_print_option"
type = "string"
block = "options"
longname = "memory print option"
description = "is a flag that controls printing of detailed memory manager usage to the end of the simulation list file.  NONE means do not print detailed information. SUMMARY means print only the total memory for each simulation component. ALL means print information for each variable stored in the memory manager. NONE is default if MEMORY_PRINT_OPTION is not specified."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.options.profile_option]
name = "profile_option"
type = "string"
block = "options"
longname = "profiling option"
description = "is a flag that controls performance profiling and reporting.  NONE disables profiling. SUMMARY means to measure and print a coarse performance profile. DETAIL means collect and print information with the highest resolution available. NONE is default if PROFILE_OPTION is not specified."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.options.maxerrors]
name = "maxerrors"
type = "integer"
block = "options"
longname = "maximum number of errors"
description = "maximum number of errors that will be stored and printed."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.options.print_input]
name = "print_input"
type = "keyword"
block = "options"
longname = "print input to listing file"
description = "keyword to activate printing of simulation input summaries to the simulation list file (mfsim.lst). With this keyword, input summaries will be written for those packages that support newer input data model routines.  Not all packages are supported yet by the newer input data model routines."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.options.hpc_filerecord]
name = "hpc_filerecord"
type = "record hpc6 filein hpc6_filename"
block = "options"
longname = ""
description = "hpc record"
optional = "true"
developmode = false
shape = ""
netcdf = false
tagged = "true"

[blocks.options.hpc6]
name = "hpc6"
type = "keyword"
block = "options"
longname = "head keyword"
description = "keyword to specify that record corresponds to a hpc file."
optional = "false"
developmode = false
shape = ""
netcdf = false
tagged = "true"

[blocks.options.filein]
name = "filein"
type = "keyword"
block = "options"
longname = "file keyword"
description = "keyword to specify that an input filename is expected next."
optional = "false"
developmode = false
shape = ""
netcdf = false
tagged = "true"

[blocks.options.hpc6_filename]
name = "hpc6_filename"
type = "string"
block = "options"
longname = "file name of time series information"
description = "name of input file to define HPC file settings for the HPC package. See the 'HPC File' section for instructions for preparing HPC input files."
optional = "false"
developmode = false
netcdf = false
tagged = "false"

[blocks.timing.tdis6]
name = "tdis6"
type = "string"
block = "timing"
longname = "name of tdis input file"
description = "is the name of the Temporal Discretization (TDIS) Input File."
optional = ""
developmode = false
netcdf = false
tagged = false

[blocks.models.models]
name = "models"
type = "recarray mtype mfname mname"
block = "models"
longname = "list of models"
description = "is the list of model types, model name files, and model names."
optional = ""
developmode = false
netcdf = false
tagged = false

[blocks.models.mtype]
name = "mtype"
type = "string"
block = "models"
longname = "model type"
description = "is the type of model to add to simulation."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.models.mfname]
name = "mfname"
type = "string"
block = "models"
longname = "file name for model name file"
description = "is the file name of the model name file."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.models.mname]
name = "mname"
type = "string"
block = "models"
longname = "name of model"
description = "is the user-assigned name of the model.  The model name cannot exceed 16 characters and must not have blanks within the name.  The model name is case insensitive; any lowercase letters are converted and stored as upper case letters."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.exchanges.exchanges]
name = "exchanges"
type = "recarray exgtype exgfile exgmnamea exgmnameb"
block = "exchanges"
longname = "list of exchanges"
description = "is the list of exchange types, exchange files, and model names."
optional = ""
developmode = false
netcdf = false
tagged = false

[blocks.exchanges.exgtype]
name = "exgtype"
type = "string"
block = "exchanges"
longname = "exchange type"
description = "is the exchange type."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.exchanges.exgfile]
name = "exgfile"
type = "string"
block = "exchanges"
longname = "input file for exchange"
description = "is the input file for the exchange."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.exchanges.exgmnamea]
name = "exgmnamea"
type = "string"
block = "exchanges"
longname = "name of model A"
description = "is the name of the first model that is part of this exchange."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.exchanges.exgmnameb]
name = "exgmnameb"
type = "string"
block = "exchanges"
longname = "name of model B"
description = "is the name of the second model that is part of this exchange."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.solutiongroup.group_num]
name = "group_num"
type = "integer"
block = "solutiongroup"
longname = ""
description = "is the group number of the solution group.  Solution groups must be numbered sequentially, starting with group number one."
optional = false
developmode = false
shape = ""
netcdf = false
tagged = "false"

[blocks.solutiongroup.mxiter]
name = "mxiter"
type = "integer"
block = "solutiongroup"
longname = "maximum solution group iterations"
description = "is the maximum number of outer iterations for this solution group.  The default value is 1.  If there is only one solution in the solution group, then MXITER must be 1."
optional = "true"
developmode = false
netcdf = false
tagged = false

[blocks.solutiongroup.solutiongroup]
name = "solutiongroup"
type = "recarray slntype slnfname slnmnames"
block = "solutiongroup"
longname = "solution type and models in the solution"
description = "is the list of solution types and models in the solution."
optional = false
developmode = false
netcdf = false
tagged = false

[blocks.solutiongroup.slntype]
name = "slntype"
type = "string"
block = "solutiongroup"
longname = "type of solution"
description = "is the type of solution.  The Integrated Model Solution (IMS6) and Explicit Model Solution (EMS6) are the only supported options in this version."
optional = false
developmode = false
valid = "ims6 ems6"
netcdf = false
tagged = "false"

[blocks.solutiongroup.slnfname]
name = "slnfname"
type = "string"
block = "solutiongroup"
longname = "file name for solution input"
description = "name of file containing solution input."
optional = false
developmode = false
netcdf = false
tagged = "false"

[blocks.solutiongroup.slnmnames]
name = "slnmnames"
type = "string"
block = "solutiongroup"
longname = "array of model names in this solution"
description = "is the array of model names to add to this solution.  The number of model names is determined by the number of model names the user provides on this line."
optional = false
developmode = false
shape = "(any1d)"
netcdf = false
tagged = "false"

