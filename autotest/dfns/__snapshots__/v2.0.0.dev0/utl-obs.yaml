name: utl-obs
advanced: false
multi: true
schema_version: 2.0.0.dev0
ref:
  parent: parent_model_or_package
  key: obs_filerecord
  val: observations
  abbr: obs
  param: continuous
options:
  digits:
    block: options
    type: integer
    reader: urword
    optional: true
    description: Keyword and an integer digits specifier used for conversion of simulated values to text
      on output. If not specified, the default is the maximum number of digits stored in the program (as
      written with the G0 Fortran specifier). When simulated values are written to a comma-separated value
      text file specified in a CONTINUOUS block below, the digits specifier controls the number of significant
      digits with which simulated values are written to the output file. The digits specifier has no effect
      on the number of significant digits with which the simulation time is written for continuous observations.  If
      DIGITS is specified as zero, then observations are written with the default setting, which is the
      maximum number of digits.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of observation information will be written to the listing
      file immediately after it is read.
continuous:
  continuous:
    block: continuous
    type: recarray
    reader: urword
    optional: false
    item:
      type: record
      block: continuous
      reader: urword
      optional: false
      fields:
        obsname:
          block: continuous
          type: string
          reader: urword
          longname: observation name
          description: string of 1 to 40 nonblank characters used to identify the observation. The identifier
            need not be unique; however, identification and post-processing of observations in the output
            files are facilitated if each observation is given a unique name.
          tagged: false
          in_record: true
        obstype:
          block: continuous
          type: string
          reader: urword
          longname: observation type
          description: a string of characters used to identify the observation type.
          tagged: false
          in_record: true
        id:
          block: continuous
          type: string
          reader: urword
          longname: time
          description: Text identifying cell where observation is located. For packages other than NPF,
            if boundary names are defined in the corresponding package input file, ID can be a boundary
            name. Otherwise ID is a cellid. If the model discretization is type DIS, cellid is three integers
            (layer, row, column). If the discretization is DISV, cellid is two integers (layer, cell number).
            If the discretization is DISU, cellid is one integer (node number).
          tagged: false
          in_record: true
          numeric_index: true
        id2:
          block: continuous
          type: string
          reader: urword
          optional: true
          longname: time
          description: Text identifying cell adjacent to cell identified by ID. The form of ID2 is as
            described for ID. ID2 is used for intercell-flow observations of a GWF model, for three observation
            types of the LAK Package, for two observation types of the MAW Package, and one observation
            type of the UZF Package.
          tagged: false
          in_record: true
          numeric_index: true
