name: gwf-api
advanced: false
multi: true
schema_version: 2.0.0.dev0
fkeys:
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
options:
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of api boundary
      cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of api boundary information will be written to the
      listing file immediately after it is read.
    mf6internal: iprpak
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated flows to listing file
    description: keyword to indicate that the list of api boundary flow rates will be printed to the listing
      file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
      there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for
      the last time step of each stress period.
    mf6internal: iprflow
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: save api flows to budget file
    description: keyword to indicate that api boundary flow terms will be written to the file specified
      with 'BUDGET FILEOUT' in Output Control.
    mf6internal: ipakcb
  observations:
    block: options
    type: record obs6 filein obs6_filename
    reader: urword
    optional: true
    description: Contains data for the obs package. Data can be passed as a dictionary to the obs package
      with variable names as keys and package data as values. Data for the observations variable is also
      acceptable. See obs package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: obs_filerecord
      val: observations
      abbr: obs
      param: continuous
  mover:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that this instance of the api boundary Package can be used with the
      Water Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
      the package to store the available, provided, and received water.
    tagged: true
dimensions:
  maxbound:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: maximum number of user-defined api boundaries
    description: integer value specifying the maximum number of api boundary cells that will be specified
      for use during any stress period.
