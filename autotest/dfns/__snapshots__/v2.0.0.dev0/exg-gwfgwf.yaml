name: exg-gwfgwf
advanced: false
multi: true
schema_version: 2.0.0.dev0
fkeys:
  gnc_filerecord:
    parent: parent_model_or_package
    key: gnc_filerecord
    val: gncdata
    abbr: gnc
    param: gncdata
  mvr_filerecord:
    parent: parent_model_or_package
    key: mvr_filerecord
    val: perioddata
    abbr: mvr
    param: perioddata
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
options:
  auxiliary:
    block: options
    type: string
    shape: (naux)
    reader: urword
    optional: true
    longname: keyword to specify aux variables
    description: an array of auxiliary variable names.  There is no limit on the number of auxiliary variables
      that can be provided. Most auxiliary variables will not be used by the GWF-GWF Exchange, but they
      will be available for use by other parts of the program.  If an auxiliary variable with the name
      'ANGLDEGX' is found, then this information will be used as the angle (provided in degrees) between
      the connection face normal and the x axis, where a value of zero indicates that a normal vector
      points directly along the positive x axis.  The connection face normal is a normal vector on the
      cell face shared between the cell in model 1 and the cell in model 2 pointing away from the model
      1 cell.  Additional information on 'ANGLDEGX' and when it is required is provided in the description
      of the DISU Package.  If an auxiliary variable with the name 'CDIST' is found, then this information
      will be used in the calculation of specific discharge within model cells connected by the exchange.  For
      a horizontal connection, CDIST should be specified as the horizontal distance between the cell centers,
      and should not include the vertical component.  For vertical connections, CDIST should be specified
      as the difference in elevation between the two cell centers.  Both ANGLDEGX and CDIST are required
      if specific discharge is calculated for either of the groundwater models.
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of GWF Exchange
      cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to print input to list file
    description: keyword to indicate that the list of exchange entries will be echoed to the listing file
      immediately after it is read.
    mf6internal: iprpak
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to print gwfgwf flows to list file
    description: keyword to indicate that the list of exchange flow rates will be printed to the listing
      file for every stress period in which 'SAVE BUDGET' is specified in Output Control.
    mf6internal: iprflow
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to save GWFGWF flows
    description: keyword to indicate that cell-by-cell flow terms will be written to the budget file for
      each model provided that the Output Control for the models are set up with the 'BUDGET SAVE FILE'
      option.
    mf6internal: ipakcb
  cell_averaging:
    block: options
    type: string
    reader: urword
    optional: true
    longname: conductance weighting option
    description: is a keyword and text keyword to indicate the method that will be used for calculating
      the conductance for horizontal cell connections.  The text value for CELL_AVERAGING can be 'HARMONIC',
      'LOGARITHMIC', or 'AMT-LMK', which means 'arithmetic-mean thickness and logarithmic-mean hydraulic
      conductivity'. If the user does not specify a value for CELL_AVERAGING, then the harmonic-mean method
      will be used.
    valid: harmonic logarithmic amt-lmk
  cvoptions:
    block: options
    type: record
    reader: urword
    optional: true
    longname: vertical conductance options
    description: none
    fields:
      variablecv:
        block: options
        type: keyword
        reader: urword
        longname: keyword to activate VARIABLECV option
        description: keyword to indicate that the vertical conductance will be calculated using the saturated
          thickness and properties of the overlying cell and the thickness and properties of the underlying
          cell.  If the DEWATERED keyword is also specified, then the vertical conductance is calculated
          using only the saturated thickness and properties of the overlying cell if the head in the underlying
          cell is below its top.  If these keywords are not specified, then the default condition is to
          calculate the vertical conductance at the start of the simulation using the initial head and
          the cell properties.  The vertical conductance remains constant for the entire simulation.
        in_record: true
      dewatered:
        block: options
        type: keyword
        reader: urword
        optional: true
        longname: keyword to activate DEWATERED option
        description: If the DEWATERED keyword is specified, then the vertical conductance is calculated
          using only the saturated thickness and properties of the overlying cell if the head in the underlying
          cell is below its top.
        in_record: true
  newton:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to activate Newton-Raphson
    description: keyword that activates the Newton-Raphson formulation for groundwater flow between connected,
      convertible groundwater cells. Cells will not dry when this option is used.
  xt3d:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to activate XT3D
    description: keyword that activates the XT3D formulation between the cells connected with this GWF-GWF
      Exchange.
  gncdata:
    block: options
    type: record gnc6 filein gnc6_filename
    reader: urword
    optional: true
    description: Contains data for the gnc package. Data can be passed as a dictionary to the gnc package
      with variable names as keys and package data as values. Data for the gncdata variable is also acceptable.
      See gnc package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: gnc_filerecord
      val: gncdata
      abbr: gnc
      param: gncdata
  perioddata:
    block: options
    type: record mvr6 filein mvr6_filename
    reader: urword
    optional: true
    description: Contains data for the mvr package. Data can be passed as a dictionary to the mvr package
      with variable names as keys and package data as values. Data for the perioddata variable is also
      acceptable. See mvr package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: mvr_filerecord
      val: perioddata
      abbr: mvr
      param: perioddata
  observations:
    block: options
    type: record obs6 filein obs6_filename
    reader: urword
    optional: true
    description: Contains data for the obs package. Data can be passed as a dictionary to the obs package
      with variable names as keys and package data as values. Data for the observations variable is also
      acceptable. See obs package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: obs_filerecord
      val: observations
      abbr: obs
      param: continuous
  dev_interfacemodel_on:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: activate interface model on exchange
    description: activates the interface model mechanism for calculating the coefficients at (and possibly
      near) the exchange. This keyword should only be used for development purposes.
    mf6internal: dev_ifmod_on
dimensions:
  nexg:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of exchanges
    description: keyword and integer value specifying the number of GWF-GWF exchanges.
exchangedata:
  exchangedata:
    block: exchangedata
    type: recarray
    shape: (nexg)
    reader: urword
    optional: false
    longname: exchange data
    item:
      type: record
      block: exchangedata
      reader: urword
      optional: false
      longname: exchange data
      fields:
        cellidm1:
          block: exchangedata
          type: integer
          reader: urword
          optional: false
          longname: cellid of first cell
          description: is the cellid of the cell in model 1 as specified in the simulation name file.
            For a structured grid that uses the DIS input file, CELLIDM1 is the layer, row, and column
            numbers of the cell.   For a grid that uses the DISV input file, CELLIDM1 is the layer number
            and CELL2D number for the two cells.  If the model uses the unstructured discretization (DISU)
            input file, then CELLIDM1 is the node number for the cell.
          in_record: true
          tagged: false
          numeric_index: true
        cellidm2:
          block: exchangedata
          type: integer
          reader: urword
          optional: false
          longname: cellid of second cell
          description: is the cellid of the cell in model 2 as specified in the simulation name file.
            For a structured grid that uses the DIS input file, CELLIDM2 is the layer, row, and column
            numbers of the cell.   For a grid that uses the DISV input file, CELLIDM2 is the layer number
            and CELL2D number for the two cells.  If the model uses the unstructured discretization (DISU)
            input file, then CELLIDM2 is the node number for the cell.
          in_record: true
          tagged: false
          numeric_index: true
        ihc:
          block: exchangedata
          type: integer
          reader: urword
          optional: false
          longname: integer flag for connection type
          description: is an integer flag indicating the direction between node n and all of its m connections.
            If IHC = 0 then the connection is vertical.  If IHC = 1 then the connection is horizontal.
            If IHC = 2 then the connection is horizontal for a vertically staggered grid.
          in_record: true
          tagged: false
        cl1:
          block: exchangedata
          type: double precision
          reader: urword
          optional: false
          longname: connection distance
          description: is the distance between the center of cell 1 and the its shared face with cell
            2.
          in_record: true
          tagged: false
        cl2:
          block: exchangedata
          type: double precision
          reader: urword
          optional: false
          longname: connection distance
          description: is the distance between the center of cell 2 and the its shared face with cell
            1.
          in_record: true
          tagged: false
        hwva:
          block: exchangedata
          type: double precision
          reader: urword
          optional: false
          longname: horizontal cell width or area for vertical flow
          description: is the horizontal width of the flow connection between cell 1 and cell 2 if IHC
            $>$ 0, or it is the area perpendicular to flow of the vertical connection between cell 1 and
            cell 2 if IHC = 0.
          in_record: true
          tagged: false
        aux:
          block: exchangedata
          type: double precision
          shape: (naux)
          reader: urword
          optional: true
          longname: auxiliary variables
          description: represents the values of the auxiliary variables for each GWFGWF Exchange. The
            values of auxiliary variables must be present for each exchange. The values must be specified
            in the order of the auxiliary variables specified in the OPTIONS block.
          in_record: true
          tagged: false
          mf6internal: auxvar
        boundname:
          block: exchangedata
          type: string
          reader: urword
          optional: true
          longname: exchange boundname
          description: name of the GWF Exchange cell.  BOUNDNAME is an ASCII character variable that can
            contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name
            must be enclosed within single quotes.
          tagged: false
          in_record: true
