name: utl-tvk
advanced: false
multi: false
schema_version: 2.0.0.dev0
fkeys:
  ts_filerecord:
    parent: parent_package
    key: ts_filerecord
    val: timeseries
    abbr: ts
    param: timeseries
    description: xxx
ref:
  parent: parent_package
  key: tvk_filerecord
  val: perioddata
  abbr: tvk
  param: tvk_perioddata
options:
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that information for each change to the hydraulic conductivity in
      a cell will be written to the model listing file.
  timeseries:
    block: options
    type: record ts6 filein ts6_filename
    reader: urword
    optional: true
    description: Contains data for the ts package. Data can be passed as a dictionary to the ts package
      with variable names as keys and package data as values. Data for the timeseries variable is also
      acceptable. See ts package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ts_filerecord
      val: timeseries
      abbr: ts
      param: timeseries
      description: xxx
period:
  transient_block: true
  perioddata:
    block: period
    type: recarray
    reader: urword
    item:
      type: record
      block: period
      reader: urword
      fields:
        cellid:
          block: period
          type: integer
          shape: (ncelldim)
          reader: urword
          longname: cell identifier
          description: is the cell identifier, and depends on the type of grid that is used for the simulation.  For
            a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For
            a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model
            uses the unstructured discretization (DISU) input file, CELLID is the node number for the
            cell.
          tagged: false
          in_record: true
        tvksetting:
          block: period
          type: keystring
          reader: urword
          description: 'line of information that is parsed into a property name keyword and values.  Property
            name keywords that can be used to start the TVKSETTING string include: K, K22, and K33.'
          tagged: false
          in_record: true
          choices:
            k:
              block: period
              type: double precision
              reader: urword
              longname: hydraulic conductivity (L/T)
              description: is the new value to be assigned as the cell's hydraulic conductivity from the
                start of the specified stress period, as per K in the NPF package.  If the OPTIONS block
                includes a TS6 entry (see the 'Time-Variable Input' section), values can be obtained from
                a time series by entering the time-series name in place of a numeric value.
              tagged: true
              in_record: true
              time_series: true
            k22:
              block: period
              type: double precision
              reader: urword
              longname: hydraulic conductivity of second ellipsoid axis (L/T)
              description: is the new value to be assigned as the cell's hydraulic conductivity of the
                second ellipsoid axis (or the ratio of K22/K if the K22OVERK NPF package option is specified)
                from the start of the specified stress period, as per K22 in the NPF package.  For an
                unrotated case this is the hydraulic conductivity in the y direction.  If the OPTIONS
                block includes a TS6 entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value.
              tagged: true
              in_record: true
              time_series: true
            k33:
              block: period
              type: double precision
              reader: urword
              longname: hydraulic conductivity of third ellipsoid axis (L/T)
              description: is the new value to be assigned as the cell's hydraulic conductivity of the
                third ellipsoid axis (or the ratio of K33/K if the K33OVERK NPF package option is specified)
                from the start of the specified stress period, as per K33 in the NPF package.  For an
                unrotated case, this is the vertical hydraulic conductivity.  If the OPTIONS block includes
                a TS6 entry (see the 'Time-Variable Input' section), values can be obtained from a time
                series by entering the time-series name in place of a numeric value.
              tagged: true
              in_record: true
              time_series: true
