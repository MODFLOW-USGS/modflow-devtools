name: sim-tdis
advanced: false
multi: false
schema_version: 2.0.0.dev0
fkeys:
  ats_filerecord:
    parent: parent_package
    key: ats_filerecord
    val: ats_perioddata
    abbr: ats
    param: perioddata
options:
  time_units:
    block: options
    type: string
    reader: urword
    optional: true
    longname: time unit
    description: is the time units of the simulation.  This is a text string that is used as a label within
      model output files.  Values for time_units may be 'unknown',  'seconds', 'minutes', 'hours', 'days',
      or 'years'.  The default time unit is 'unknown'.
  start_date_time:
    block: options
    type: string
    reader: urword
    optional: true
    longname: starting date and time
    description: is the starting date and time of the simulation.  This is a text string that is used
      as a label within the simulation list file.  The value has no effect on the simulation.  The recommended
      format for the starting date and time is described at https://www.w3.org/TR/NOTE-datetime.
  ats_perioddata:
    block: options
    type: record ats6 filein ats6_filename
    reader: urword
    optional: true
    description: Contains data for the ats package. Data can be passed as a dictionary to the ats package
      with variable names as keys and package data as values. Data for the ats_perioddata variable is
      also acceptable. See ats package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ats_filerecord
      val: ats_perioddata
      abbr: ats
      param: perioddata
dimensions:
  nper:
    block: dimensions
    type: integer
    default: 1
    reader: urword
    optional: false
    longname: number of stress periods
    description: is the number of stress periods for the simulation.
perioddata:
  perioddata:
    block: perioddata
    type: recarray
    reader: urword
    optional: false
    longname: stress period time information
    default:
      - - 1.0
        - 1
        - 1.0
    item:
      type: record
      block: perioddata
      reader: urword
      optional: false
      longname: stress period time information
      fields:
        perlen:
          block: perioddata
          type: double precision
          reader: urword
          optional: false
          longname: length of stress period
          description: is the length of a stress period.
          in_record: true
          tagged: false
        nstp:
          block: perioddata
          type: integer
          reader: urword
          optional: false
          longname: number of time steps
          description: is the number of time steps in a stress period.
          in_record: true
          tagged: false
        tsmult:
          block: perioddata
          type: double precision
          reader: urword
          optional: false
          longname: number of time steps
          description: is the multiplier for the length of successive time steps. The length of a time
            step is calculated by multiplying the length of the previous time step by TSMULT. The length
            of the first time step, $Delta t_1$, is related to PERLEN, NSTP, and TSMULT by the relation
            $Delta t_1= perlen frac{tsmult - 1}{tsmult^{nstp}-1}$.
          in_record: true
          tagged: false
