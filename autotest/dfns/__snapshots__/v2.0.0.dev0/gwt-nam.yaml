name: gwt-nam
advanced: false
multi: false
schema_version: 2.0.0.dev0
options:
  list:
    block: options
    type: string
    reader: urword
    optional: true
    longname: name of listing file
    description: is name of the listing file to create for this GWT model.  If not specified, then the
      name of the list file will be the basename of the GWT model name file and the '.lst' extension.  For
      example, if the GWT name file is called 'my.model.nam' then the list file will be called 'my.model.lst'.
    preserve_case: true
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of all model stress package information will be written
      to the listing file immediately after it is read.
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated flows to listing file
    description: keyword to indicate that the list of all model package flow rates will be printed to
      the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
      Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are
      printed for the last time step of each stress period.
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: save flows for all packages to budget file
    description: keyword to indicate that all model package flow terms will be written to the file specified
      with 'BUDGET FILEOUT' in Output Control.
  dependent_variable_scaling:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: flag to scale X and RHS
    description: flag to scale X and RHS to avoid very large positive or negative dependent variable values
    mf6internal: idv_scale
  nc_mesh2d_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    description: NetCDF layered mesh fileout record.
    tagged: true
    mf6internal: ncmesh2drec
    fields:
      netcdf_mesh2d:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to a layered mesh NetCDF file.
        in_record: true
        tagged: true
        extended: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      ncmesh2dfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the NetCDF ugrid layered mesh output file.
        preserve_case: true
        in_record: true
        tagged: false
        extended: true
  nc_structured_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    description: NetCDF structured fileout record.
    tagged: true
    mf6internal: ncstructrec
    fields:
      netcdf_structured:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to a structured NetCDF file.
        in_record: true
        tagged: true
        mf6internal: netcdf_struct
        extended: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      ncstructfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the NetCDF structured output file.
        preserve_case: true
        in_record: true
        tagged: false
        extended: true
  nc_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    description: NetCDF filerecord
    tagged: true
    fields:
      netcdf:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: netcdf keyword
        description: keyword to specify that record corresponds to a NetCDF input file.
        in_record: true
        tagged: true
        extended: true
      filein:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an input filename is expected next.
        in_record: true
        tagged: true
      netcdf_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: netcdf input filename
        description: defines a NetCDF input file.
        preserve_case: true
        in_record: true
        tagged: false
        mf6internal: netcdf_fname
        extended: true
packages:
  packages:
    block: packages
    type: recarray
    reader: urword
    optional: false
    longname: package list
    item:
      type: record
      block: packages
      reader: urword
      optional: false
      longname: package list
      fields:
        ftype:
          block: packages
          type: string
          reader: urword
          longname: package type
          description: is the file type, which must be one of the following character values shown in
            table~ref{table:ftype-gwt}. Ftype may be entered in any combination of uppercase and lowercase.
          in_record: true
          tagged: false
        fname:
          block: packages
          type: string
          reader: urword
          longname: file name
          description: is the name of the file containing the package input.  The path to the file should
            be included if the file is not located in the folder where the program was run.
          in_record: true
          preserve_case: true
          tagged: false
        pname:
          block: packages
          type: string
          reader: urword
          optional: true
          longname: user name for package
          description: is the user-defined name for the package. PNAME is restricted to 16 characters.  No
            spaces are allowed in PNAME.  PNAME character values are read and stored by the program for
            stress packages only.  These names may be useful for labeling purposes when multiple stress
            packages of the same type are located within a single GWT Model.  If PNAME is specified for
            a stress package, then PNAME will be used in the flow budget table in the listing file; it
            will also be used for the text entry in the cell-by-cell budget file.  PNAME is case insensitive
            and is stored in all upper case letters.
          in_record: true
          tagged: false
