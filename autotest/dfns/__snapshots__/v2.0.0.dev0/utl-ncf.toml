name = "utl-ncf"
advanced = false
multi = false
schema_version = "2.0.0.dev0"

[ref]
parent = "parent_package"
key = "ncf_filerecord"
val = "packagedata"
abbr = "ncf"
param = "packagedata"

[options.wkt]
block = "options"
type = "string"
shape = "lenbigline"
reader = "urword"
optional = true
longname = "CRS well-known text (WKT) string"
description = "is the coordinate reference system (CRS) well-known text (WKT) string. Used to embed CRS metadata in NetCDF output. Ignored if latitude and longitude griddata arrays have been provided for NETCDF_STRUCTURED export type."

[options.deflate]
block = "options"
type = "integer"
reader = "urword"
optional = true
longname = "variable compression deflate level"
description = "is the variable deflate level (0=min, 9=max) in the NetCDF file. Defining this parameter activates per-variable compression at the level specified. Use with the SHUFFLE option to also enable the shuffle filter."

[options.shuffle]
block = "options"
type = "keyword"
reader = "urword"
optional = true
description = "is the keyword used to turn on the NetCDF variable shuffle filter when the deflate option is also set. The shuffle filter has the effect of storing the first byte of all of a variable's values in a chunk contiguously, followed by all the second bytes, etc. This can be an optimization for compression with certain types of data."

[options.chunk_time]
block = "options"
type = "integer"
reader = "urword"
optional = true
longname = "chunking parameter for the time dimension"
description = "is the chunk size for the time dimension in a NETCDF_MESH2D or NETCDF_STRUCTURED output file. Must be used in combination with the chunk_face parameter (NETCDF_MESH2D) or the chunk_z, chunk_y, and chunk_x parameter set (NETCDF_STRUCTURED) to have an effect."

[options.chunk_face]
block = "options"
type = "integer"
reader = "urword"
optional = true
longname = "chunking parameter for the mesh face dimension"
description = "is the keyword used to provide a data chunk size for the face dimension in a NETCDF_MESH2D output file. Must be used in combination with the the chunk_time parameter to have an effect."

[options.chunk_z]
block = "options"
type = "integer"
reader = "urword"
optional = true
longname = "chunking parameter for structured z"
description = "is the chunk size for the z dimension in a NETCDF_STRUCTURED output file. Must be used in combination with the chunk_time, chunk_x, and chunk_y parameters to have an effect."

[options.chunk_y]
block = "options"
type = "integer"
reader = "urword"
optional = true
longname = "chunking parameter for structured y"
description = "is the chunk size for the y dimension in a NETCDF_STRUCTURED output file. Must be used in combination with the chunk_time, chunk_x, and chunk_z parameters to have an effect."

[options.chunk_x]
block = "options"
type = "integer"
reader = "urword"
optional = true
longname = "chunking parameter for structured x"
description = "is the chunk size for the x dimension in a NETCDF_STRUCTURED output file. Must be used in combination with the chunk_time, chunk_y, and chunk_z parameters to have an effect."

[options.modflow6_attr_off]
block = "options"
type = "keyword"
reader = "urword"
optional = true
description = "is the keyword used to turn off internal input tagging in the model NetCDF file. Tagging adds internal modflow 6 attribute(s) to variables which facilitate identification. Currently this applies to gridded arrays."
mf6internal = "attr_off"

[dimensions.ncpl]
block = "dimensions"
type = "integer"
reader = "urword"
optional = true
longname = "number of cells in layer"
description = "is the number of cells in a projected plane layer."

[griddata.latitude]
block = "griddata"
type = "double precision"
shape = "(ncpl)"
reader = "readarray"
optional = true
longname = "cell center latitude"
description = "cell center latitude. Only supported for NETCDF_STRUCTURED export type."

[griddata.longitude]
block = "griddata"
type = "double precision"
shape = "(ncpl)"
reader = "readarray"
optional = true
longname = "cell center longitude"
description = "cell center longitude. Only supported for NETCDF_STRUCTURED export type."
