name: chf-sto
advanced: false
multi: false
schema_version: 2.0.0.dev0
options:
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to save NPF flows
    description: keyword to indicate that cell-by-cell flow terms will be written to the file specified
      with 'BUDGET SAVE FILE' in Output Control.
    mf6internal: ipakcb
  export_array_ascii:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: export array variables to layered ascii files.
    description: keyword that specifies input grid arrays, which already support the layered keyword,
      should be written to layered ascii output files.
    mf6internal: export_ascii
period:
  transient_block: true
  steady-state:
    block: period
    type: keyword
    reader: urword
    optional: true
    longname: steady state indicator
    description: keyword to indicate that stress period IPER is steady-state. Steady-state conditions
      will apply until the TRANSIENT keyword is specified in a subsequent BEGIN PERIOD block.
    mf6internal: steady_state
  transient:
    block: period
    type: keyword
    reader: urword
    optional: true
    longname: transient indicator
    description: keyword to indicate that stress period IPER is transient. Transient conditions will apply
      until the STEADY-STATE keyword is specified in a subsequent BEGIN PERIOD block.
