name = "prt-fmi"
schema_version = "2.0.0.dev1"
advanced = false
multi = false
ftype = "FMI"

[blocks.options.save_flows]
block = "options"
description = "keyword to indicate that FMI flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
reader = "urword"
optional = true
longname = "save cell-by-cell flows to budget file"
type = "keyword"

[blocks.packagedata.packagedata]
block = "packagedata"
reader = "urword"
optional = true
longname = "flowtype list"
type = "list"

[blocks.packagedata.packagedata.children.packagedata]
block = "packagedata"
reader = "urword"
optional = true
longname = "flowtype list"
type = "record"

[blocks.packagedata.packagedata.children.packagedata.children.flowtype]
block = "packagedata"
description = "is the word GWFBUDGET, GWFHEAD, or GWFGRID.  If GWFBUDGET is specified, then the corresponding file must be a budget file.  If GWFHEAD is specified, the file must be a head file.  If GWFGRID is specified, the file must be a binary grid file."
reader = "urword"
longname = "flow type"
type = "string"

[blocks.packagedata.packagedata.children.packagedata.children.filein]
block = "packagedata"
description = "keyword to specify that an input filename is expected next."
reader = "urword"
optional = false
longname = "file keyword"
type = "keyword"

[blocks.packagedata.packagedata.children.packagedata.children.fname]
block = "packagedata"
description = "is the name of the file containing flows.  The path to the file should be included if the file is not located in the folder where the program was run."
reader = "urword"
longname = "file name"
type = "string"
