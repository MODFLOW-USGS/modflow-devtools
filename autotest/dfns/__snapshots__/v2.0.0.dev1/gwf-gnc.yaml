name: gwf-gnc
schema_version: 2.0.0.dev1
parent: parent_model_or_package
advanced: false
multi: false
ftype: GNC
blocks:
  options:
    print_input:
      block: options
      description: keyword to indicate that the list of GNC information will be written to the listing
        file immediately after it is read.
      reader: urword
      optional: true
      longname: print input to listing file
      type: keyword
    print_flows:
      block: options
      description: keyword to indicate that the list of GNC flow rates will be printed to the listing
        file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
        there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
        for the last time step of each stress period.
      reader: urword
      optional: true
      longname: print simulated flows to listing file
      type: keyword
    explicit:
      block: options
      description: keyword to indicate that the ghost node correction is applied in an explicit manner
        on the right-hand side of the matrix.  The explicit approach will likely require additional outer
        iterations.  If the keyword is not specified, then the correction will be applied in an implicit
        manner on the left-hand side.  The implicit approach will likely converge better, but may require
        additional memory.  If the EXPLICIT keyword is not specified, then the BICGSTAB linear acceleration
        option should be specified within the LINEAR block of the Sparse Matrix Solver.
      reader: urword
      optional: true
      longname: use explicit GNC formulation
      type: keyword
  dimensions:
    numgnc:
      block: dimensions
      description: is the number of GNC entries.
      reader: urword
      optional: false
      longname: number of ghost node corrections
      type: integer
    numalphaj:
      block: dimensions
      description: is the number of contributing factors.
      reader: urword
      optional: false
      longname: number of contributing factors
      type: integer
  gncdata:
    gncdata:
      shape: (maxbound)
      block: gncdata
      reader: urword
      type: list
      children:
        gncdata:
          shape: (maxbound)
          block: gncdata
          reader: urword
          type: record
          children:
            cellidn:
              block: gncdata
              description: is the cellid of the cell, $n$, in which the ghost node is located. For a structured
                grid that uses the DIS input file, CELLIDN is the layer, row, and column numbers of the
                cell.   For a grid that uses the DISV input file, CELLIDN is the layer number and CELL2D
                number for the two cells.  If the model uses the unstructured discretization (DISU) input
                file, then CELLIDN is the node number for the cell.
              reader: urword
              longname: GNC cellid n
              numeric_index: true
              type: integer
            cellidm:
              block: gncdata
              description: is the cellid of the connecting cell, $m$, to which flow occurs from the ghost
                node. For a structured grid that uses the DIS input file, CELLIDM is the layer, row, and
                column numbers of the cell.   For a grid that uses the DISV input file, CELLIDM is the
                layer number and CELL2D number for the two cells.  If the model uses the unstructured
                discretization (DISU) input file, then CELLIDM is the node number for the cell.
              reader: urword
              longname: GNC cellid n
              numeric_index: true
              type: integer
            cellidsj:
              shape: (numalphaj)
              block: gncdata
              description: is the array of CELLIDS for the contributing j cells, which contribute to the
                interpolated head value at the ghost node. This item contains one CELLID for each of the
                contributing cells of the ghost node. Note that if the number of actual contributing cells
                needed by the user is less than NUMALPHAJ for any ghost node, then a dummy CELLID of zero(s)
                should be inserted with an associated contributing factor of zero. For a structured grid
                that uses the DIS input file, CELLID is the layer, row, and column numbers of the cell.   For
                a grid that uses the DISV input file, CELLID is the layer number and cell2d number for
                the two cells.  If the model uses the unstructured discretization (DISU) input file, then
                CELLID is the node number for the cell.
              reader: urword
              longname: GNC contributing cells
              numeric_index: true
              type: integer
            alphasj:
              shape: (numalphaj)
              block: gncdata
              description: is the contributing factors for each contributing node in CELLIDSJ. Note that
                if the number of actual contributing cells is less than NUMALPHAJ for any ghost node,
                then dummy CELLIDS should be inserted with an associated contributing factor of zero.  The
                sum of ALPHASJ should be less than one.  This is because one minus the sum of ALPHASJ
                is equal to the alpha term (alpha n in equation 4-61 of the GWF Model report) that is
                multiplied by the head in cell n.
              reader: urword
              longname: GNC contributing factors
              type: double
