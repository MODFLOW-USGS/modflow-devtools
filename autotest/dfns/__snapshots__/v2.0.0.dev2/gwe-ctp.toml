type = "package"
schema_version = "2.0.0.dev2"
name = "gwe-ctp"
parent = "gwe-nam"
multi = true
subtype = "stress"

[dims.maxbound]
value = "maxbound"
scope = "model"

[dims.auxiliary]
value = "len(auxiliary)"

[blocks.options.fields.auxiliary]
type = "array"
longname = "keyword to specify aux variables"
description = "defines an array of one or more auxiliary variable names.  There is no limit on the number of auxiliary variables that can be provided on this line; however, lists of information provided in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary variables may not be used by the package, but they will be available for use by other parts of the program.  The program will terminate with an error if auxiliary variables are specified on more than one line in the options block."
optional = true
dtype = "string"

[blocks.options.fields.auxmultname]
type = "string"
longname = "name of auxiliary variable for multiplier"
description = "name of auxiliary variable to be used as multiplier of temperature value."
optional = true
tagged = false

[blocks.options.fields.boundnames]
type = "keyword"
description = "keyword to indicate that boundary names may be provided with the list of constant temperature cells."
optional = true

[blocks.options.fields.print_input]
type = "keyword"
longname = "print input to listing file"
description = "keyword to indicate that the list of constant temperature information will be written to the listing file immediately after it is read."
optional = true

[blocks.options.fields.print_flows]
type = "keyword"
longname = "print calculated flows to listing file"
description = "keyword to indicate that the list of constant temperature flow rates will be printed to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the last time step of each stress period."
optional = true

[blocks.options.fields.save_flows]
type = "keyword"
longname = "save constant temperature flows to budget file"
description = "keyword to indicate that constant temperature flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
optional = true

[blocks.options.fields.ts_filerecord]
type = "record"
optional = true

[blocks.options.fields.ts_filerecord.fields.ts6]
type = "file"
longname = "time series keyword"
description = "keyword to specify that record corresponds to a time-series file."
mode = "filein"

[blocks.options.fields.obs_filerecord]
type = "record"
optional = true

[blocks.options.fields.obs_filerecord.fields.obs6]
type = "file"
longname = "obs keyword"
description = "keyword to specify that record corresponds to an observations file."
mode = "filein"

[blocks.dimensions.fields.maxbound]
type = "integer"
longname = "maximum number of constant temperatures"
description = "integer value specifying the maximum number of constant temperature cells that will be specified for use during any stress period."
tagged = false

[blocks.period.fields.stress_period_data]
type = "list"
shape = [
    "maxbound",
]

[blocks.period.fields.stress_period_data.item]
type = "record"

[blocks.period.fields.stress_period_data.item.fields.cellid]
type = "array"
longname = "cell identifier"
description = "is the cell identifier, and depends on the type of grid that is used for the simulation.  For a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model uses the unstructured discretization (DISU) input file, CELLID is the node number for the cell."
dtype = "integer"
shape = [
    "ncelldim",
]

[blocks.period.fields.stress_period_data.item.fields.temp]
type = "double"
longname = "constant temperature value"
description = "is the constant temperature value. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = false
time_series = true

[blocks.period.fields.stress_period_data.item.fields.aux]
type = "array"
longname = "auxiliary variables"
description = "represents the values of the auxiliary variables for each constant temperature. The values of auxiliary variables must be present for each constant temperature. The values must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
optional = true
dtype = "double"
time_series = true
shape = [
    "auxiliary",
]

[blocks.period.fields.stress_period_data.item.fields.boundname]
type = "string"
longname = "constant temperature name"
description = "name of the constant temperature cell.  BOUNDNAME is an ASCII character variable that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be enclosed within single quotes."
optional = true
tagged = false
