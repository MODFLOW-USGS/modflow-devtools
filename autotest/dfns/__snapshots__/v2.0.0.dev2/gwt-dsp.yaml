type: package
schema_version: 2.0.0.dev2
name: gwt-dsp
parent: gwt-nam
blocks:
  options:
    fields:
      xt3d_off:
        type: keyword
        longname: deactivate xt3d
        description: deactivate the xt3d method and use the faster and less accurate approximation.  This
          option may provide a fast and accurate solution under some circumstances, such as when flow
          aligns with the model grid, there is no mechanical dispersion, or when the longitudinal and
          transverse dispersivities are equal.  This option may also be used to assess the computational
          demand of the XT3D approach by noting the run time differences with and without this option
          on.
        optional: true
      xt3d_rhs:
        type: keyword
        longname: xt3d on right-hand side
        description: add xt3d terms to right-hand side, when possible.  This option uses less memory,
          but may require more iterations.
        optional: true
      export_array_ascii:
        type: keyword
        longname: export array variables to layered ascii files.
        description: keyword that specifies input griddata arrays should be written to layered ascii output
          files.
        optional: true
      export_array_netcdf:
        type: keyword
        longname: export array variables to netcdf output files.
        description: keyword that specifies input gridded arrays should be written to the model output
          NetCDF file with attributes that support using the generated file as a MODFLOW 6 simulation
          input.  This option only has an effect when an output model NetCDF file is configured and the
          simulation is run in VALIDATE mode, otherwise it is ignored.
        optional: true
  griddata:
    fields:
      diffc:
        type: array
        longname: effective molecular diffusion coefficient
        description: effective molecular diffusion coefficient.
        optional: true
        netcdf: true
        dtype: double
        shape:
          - nodes
      alh:
        type: array
        longname: longitudinal dispersivity in horizontal direction
        description: longitudinal dispersivity in horizontal direction.  If flow is strictly horizontal,
          then this is the longitudinal dispersivity that will be used.  If flow is not strictly horizontal
          or strictly vertical, then the longitudinal dispersivity is a function of both ALH and ALV.  If
          mechanical dispersion is represented (by specifying any dispersivity values) then this array
          is required.
        optional: true
        netcdf: true
        dtype: double
        shape:
          - nodes
      alv:
        type: array
        longname: longitudinal dispersivity in vertical direction
        description: longitudinal dispersivity in vertical direction.  If flow is strictly vertical, then
          this is the longitudinal dispsersivity value that will be used.  If flow is not strictly horizontal
          or strictly vertical, then the longitudinal dispersivity is a function of both ALH and ALV.  If
          this value is not specified and mechanical dispersion is represented, then this array is set
          equal to ALH.
        optional: true
        netcdf: true
        dtype: double
        shape:
          - nodes
      ath1:
        type: array
        longname: transverse dispersivity in horizontal direction
        description: transverse dispersivity in horizontal direction.  This is the transverse dispersivity
          value for the second ellipsoid axis.  If flow is strictly horizontal and directed in the x direction
          (along a row for a regular grid), then this value controls spreading in the y direction.  If
          mechanical dispersion is represented (by specifying any dispersivity values) then this array
          is required.
        optional: true
        netcdf: true
        dtype: double
        shape:
          - nodes
      ath2:
        type: array
        longname: transverse dispersivity in horizontal direction
        description: transverse dispersivity in horizontal direction.  This is the transverse dispersivity
          value for the third ellipsoid axis.  If flow is strictly horizontal and directed in the x direction
          (along a row for a regular grid), then this value controls spreading in the z direction.  If
          this value is not specified and mechanical dispersion is represented, then this array is set
          equal to ATH1.
        optional: true
        netcdf: true
        dtype: double
        shape:
          - nodes
      atv:
        type: array
        longname: transverse dispersivity when flow is in vertical direction
        description: transverse dispersivity when flow is in vertical direction.  If flow is strictly
          vertical and directed in the z direction, then this value controls spreading in the x and y
          directions.  If this value is not specified and mechanical dispersion is represented, then this
          array is set equal to ATH2.
        optional: true
        netcdf: true
        dtype: double
        shape:
          - nodes
