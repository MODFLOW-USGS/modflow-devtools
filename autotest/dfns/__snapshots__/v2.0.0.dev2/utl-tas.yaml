type: package
schema_version: 2.0.0.dev2
name: utl-tas
parent: sim-nam
multi: true
subtype: utility
dims:
  time_series_name:
    value: len(time_series_name)
blocks:
  attributes:
    fields:
      time_series_namerecord:
        type: record
        description: xxx
        fields:
          name:
            type: keyword
            description: xxx
          time_series_name:
            type: array
            description: Name by which a package references a particular time-array series. The name must
              be unique among all time-array series used in a package.
            dtype: string
      interpolation_methodrecord:
        type: record
        description: xxx
        optional: true
        fields:
          method:
            type: keyword
            description: ' xxx'
          interpolation_method:
            type: string
            description: Interpolation method, which is either STEPWISE or LINEAR.
            tagged: false
            valid:
              - stepwise
              - linear
              - linearend
      sfacrecord:
        type: record
        description: xxx
        optional: true
        fields:
          sfac:
            type: keyword
            description: ' xxx'
          sfacval:
            type: array
            description: Scale factor, which will multiply all array values in time series. SFAC is an
              optional attribute; if omitted, SFAC = 1.0.
            dtype: double
            shape:
              - time_series_name
  time:
    fields:
      tas_array:
        type: array
        description: An array of numeric, floating-point values, or a constant value, readable by the
          U2DREL array-reading utility.
        dtype: double
